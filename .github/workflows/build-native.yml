name: Build FINANCEVERSE Apps

on:
  workflow_dispatch:
  push:
    branches:
      - app-platforms
    paths:
      - 'index.html'
      - 'config.js'
      - 'package.json'
      - 'capacitor.config.json'
      - 'electron/**'
      - 'scripts/**'
      - '.github/workflows/build-native.yml'

permissions:
  contents: read

jobs:
  windows:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build Windows installer
        run: npm run desktop:build -- --publish never
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: FINANCEVERSE-Windows-Installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14

  android:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools, platforms;android-36, build-tools;36.0.0'
          accept-android-sdk-licenses: true
      - name: Install dependencies
        run: npm install
      - name: Generate Android project and sync web app
        run: npm run android:init
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: FINANCEVERSE-Android-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
